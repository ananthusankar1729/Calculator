<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="./js/javascript.js" type="module"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <h1>Calculator</h1>
        <div class="box">
            <div class="disp">
                
            </div>
            <div class="box2">
                <button class="digits 7">7</button>
                <button class="digits 8">8</button>
                <button class="digits 9">9</button>
                <button class="operation add">+</button>
            </div>
            <div class="box2">
                <button class="digits 4">4</button>
                <button class="digits 5">5</button>
                <button class="digits 6">6</button>
                <button class="operation subtract">-</button>
            </div>
            <div class="box2">
                <button class="digits 1">1</button>
                <button class="digits 2">2</button>
                <button class="digits 3">3</button>
                <button class="operation multiply">x</button>
            </div>
            <div class="box2">
                <button class="digits 0">0</button>
                <button class=" operation divide">/</button> 
                <button class="clear">clear</button>
                <button class="equalto">=</button>
            </div>
        </div>  
    </div>
</body>
</html>
