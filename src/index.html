<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <source src="./js/javascript.js" type="module">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <h1>Calculator</h1>
        <div class="box">
            <div class="disp">
            </div>
            <div class="box2">
                <button class="digits">7</button>
                <button class="digits">8</button>
                <button class="digits">9</button>
                <button class="add">+</button>
            </div>
            <div class="box2">
                <button class="digits">4</button>
                <button class="digits">5</button>
                <button class="digits">6</button>
                <button class="subtract">-</button>
            </div>
            <div class="box2">
                <button class="digits">1</button>
                <button class="digits">2</button>
                <button class="digits">3</button>
                <button class="multiply">x</button>
            </div>
            <div class="box2">
                <button class="digits">0</button>
                <button class="divide">/</button> 
                <button class="clear">clear</button>
                <button class="equalto">=</button>
            </div>
        </div>  
    </div>
</body>
</html>
